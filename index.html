<title>التحضير للعملية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
  :root {
    --bg: #f5f3ef;
    --bg-card: #ffffff;
    --fg: #2a2d33;
    --fg-muted: #6a6f7a;
    --fg-dim: #9a9ea8;
    --border: #e2dfd9;
    --teal: #1a7a6c;
    --teal-soft: #e2f3ef;
    --teal-hover: #156b5e;
    --coral: #c44a3c;
    --coral-soft: #fce8e5;
    --amber: #b47a12;
    --amber-soft: #fdf2dc;
    --green: #2e7a4e;
    --green-soft: #e4f3e8;
    --chat-user: #e8f0fe;
    --chat-ai: var(--teal-soft);
    --display-ar: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
    --body-ar: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
    --display-en: 'DM Serif Display', Georgia, serif;
    --body-en: 'Source Sans 3', system-ui, sans-serif;
    --display: var(--display-ar);
    --body: var(--body-ar);
    --radius: 10px;
    --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191b1f; --bg-card: #24262b; --fg: #e2dfd9; --fg-muted: #9a9ea8;
      --fg-dim: #6a6f7a; --border: #363a42; --teal: #48c0ad; --teal-soft: #1c2c29;
      --teal-hover: #5ad0bd; --coral: #ec7a6c; --coral-soft: #2c211f; --amber: #e4a83a;
      --amber-soft: #2c2618; --green: #58b87a; --green-soft: #1c2c20;
      --chat-user: #2a3040; --chat-ai: var(--teal-soft); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191b1f; --bg-card: #24262b; --fg: #e2dfd9; --fg-muted: #9a9ea8;
    --fg-dim: #6a6f7a; --border: #363a42; --teal: #48c0ad; --teal-soft: #1c2c29;
    --teal-hover: #5ad0bd; --coral: #ec7a6c; --coral-soft: #2c211f; --amber: #e4a83a;
    --amber-soft: #2c2618; --green: #58b87a; --green-soft: #1c2c20;
    --chat-user: #2a3040; --chat-ai: var(--teal-soft); color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }
  html { direction: rtl; }
  html[data-lang="en"] { direction: ltr; }
  html[data-lang="en"] { --display: var(--display-en); --body: var(--body-en); }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body);
    font-size: 16px; line-height: 1.75;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px; max-width: 740px; margin: 0 auto;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
  }

  /* Lang toggle */
  .lang-toggle {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    z-index: 15;
    font-family: var(--body-en);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--fg-muted);
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex; align-items: center; gap: 6px;
  }
  html[data-lang="en"] .lang-toggle {
    right: calc(12px + env(safe-area-inset-right, 0px));
    left: auto;
  }
  .lang-toggle:hover { border-color: var(--teal); color: var(--teal); }
  .lang-toggle svg { width: 14px; height: 14px; }

  .header { padding: 32px 0 20px; text-align: center; }
  .header-label { font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--teal); margin-bottom: 8px; }
  .header h1 { font-family: var(--display); font-size: clamp(26px, 5vw, 36px); font-weight: 700; line-height: 1.4; text-wrap: balance; margin-bottom: 6px; }
  .header p { color: var(--fg-muted); font-size: 15px; }

  .countdown { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
  .countdown-unit { text-align: center; min-width: 60px; }
  .countdown-num { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--teal); font-variant-numeric: tabular-nums; }
  .countdown-label { font-size: 12px; color: var(--fg-muted); margin-top: 4px; }

  .surgery-info { background: var(--teal-soft); border: 1px solid var(--teal); border-radius: var(--radius); padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px 32px; margin-bottom: 28px; }
  .surgery-info-item { display: flex; flex-direction: column; gap: 2px; }
  .surgery-info-label { font-size: 11px; font-weight: 600; color: var(--fg-muted); }
  .surgery-info-value { font-weight: 600; font-size: 15px; }

  .progress-wrap { margin: 8px 0 20px; }
  .progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--fg-muted); }
  .progress-pct { font-size: 13px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--teal); border-radius: 3px; transition: width 0.4s ease; }

  .phase-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .phase-nav::-webkit-scrollbar { display: none; }
  .phase-btn { font-family: var(--body); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .phase-btn:hover { border-color: var(--teal); color: var(--teal); }
  .phase-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .phase-btn .count { display: inline-block; background: rgba(255,255,255,0.25); border-radius: 100px; padding: 0 6px; margin-inline-start: 6px; font-size: 11px; direction: ltr; }
  .phase-btn:not(.active) .count { background: var(--teal-soft); color: var(--teal); }

  .section { margin-bottom: 24px; }
  .section-title { font-family: var(--display); font-size: 20px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  html[data-lang="en"] .section-title { font-weight: 400; }
  .section-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

  .checklist { display: flex; flex-direction: column; gap: 8px; }
  .check-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none; }
  .check-item:hover { border-color: var(--teal); }
  .check-item.done { background: var(--green-soft); border-color: transparent; }
  .check-item.done .check-text { text-decoration: line-through; color: var(--fg-muted); }
  .checkbox { width: 22px; height: 22px; border-radius: var(--radius-sm); border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; margin-top: 3px; }
  .check-item.done .checkbox { background: var(--green); border-color: var(--green); }
  .checkbox svg { opacity: 0; transition: opacity 0.15s; }
  .check-item.done .checkbox svg { opacity: 1; }
  .check-content { flex: 1; min-width: 0; }
  .check-text { font-weight: 600; font-size: 15px; transition: color 0.15s; }
  .check-desc { font-size: 13px; color: var(--fg-muted); margin-top: 2px; }
  .check-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; margin-top: 6px; }
  .tag-important { background: var(--coral-soft); color: var(--coral); }
  .tag-reminder { background: var(--amber-soft); color: var(--amber); }

  .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .info-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .info-card h3 { font-family: var(--display); font-size: 16px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  html[data-lang="en"] .info-card h3 { font-weight: 400; }
  .info-card ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .info-card li { font-size: 14px; color: var(--fg-muted); padding-inline-start: 18px; position: relative; }
  .info-card li::before { content: ''; position: absolute; inset-inline-start: 0; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

  .alert { border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 12px; align-items: flex-start; }
  .alert-coral { background: var(--coral-soft); border: 1px solid var(--coral); }
  .alert-amber { background: var(--amber-soft); border: 1px solid var(--amber); }
  .alert-icon { font-size: 18px; flex-shrink: 0; line-height: 1.75; }
  .alert-content { flex: 1; min-width: 0; }
  .alert-content strong { display: block; font-size: 15px; margin-bottom: 2px; }
  .alert-content p { font-size: 14px; color: var(--fg-muted); }

  .contact-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-wrap: wrap; gap: 14px 36px; margin-bottom: 24px; }
  .contact-entry { display: flex; flex-direction: column; gap: 2px; }
  .contact-label { font-size: 11px; font-weight: 600; color: var(--fg-muted); }
  .contact-value { font-weight: 600; font-size: 15px; direction: ltr; }

  .footer { text-align: center; padding: 20px 0; font-size: 12px; color: var(--fg-dim); border-top: 1px solid var(--border); margin-top: 20px; }

  .phase-section { display: none; }
  .phase-section.visible { display: block; }

  /* Chat */
  .chat-fab { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 56px; height: 56px; border-radius: 50%; background: var(--teal); color: #fff; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
  .chat-fab { left: calc(20px + env(safe-area-inset-left, 0px)); }
  html[data-lang="en"] .chat-fab { left: auto; right: calc(20px + env(safe-area-inset-right, 0px)); }
  .chat-fab:hover { background: var(--teal-hover); transform: scale(1.06); }
  .chat-panel { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 40px)); max-height: min(520px, calc(100vh - 140px)); background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); z-index: 20; display: none; flex-direction: column; overflow: hidden; }
  .chat-panel { left: calc(20px + env(safe-area-inset-left, 0px)); }
  html[data-lang="en"] .chat-panel { left: auto; right: calc(20px + env(safe-area-inset-right, 0px)); }
  .chat-panel.open { display: flex; }
  .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .chat-header-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--teal-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-header-text { flex: 1; min-width: 0; }
  .chat-header-text h3 { font-family: var(--display); font-size: 15px; font-weight: 700; }
  .chat-header-text p { font-size: 11px; color: var(--fg-muted); line-height: 1.3; }
  .chat-close { width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--border); color: var(--fg-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .chat-msg.user { align-self: flex-end; background: var(--chat-user); border-end-start-radius: 4px; }
  .chat-msg.ai { align-self: flex-start; background: var(--chat-ai); border-end-end-radius: 4px; }
  .chat-msg.typing .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fg-dim); margin: 0 2px; animation: dot-bounce 1.2s infinite; }
  .chat-msg.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .chat-msg.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  .chat-input-wrap { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  .chat-input { flex: 1; min-width: 0; font-family: var(--body); font-size: 14px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--fg); resize: none; max-height: 100px; line-height: 1.5; }
  .chat-input:focus { outline: none; border-color: var(--teal); }
  .chat-input::placeholder { color: var(--fg-dim); }
  .chat-send { width: 38px; height: 38px; border-radius: 50%; background: var(--teal); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  .chat-send:hover { background: var(--teal-hover); }
  .chat-send:disabled { opacity: 0.5; cursor: default; }
  .suggestions { padding: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .suggestion-chip { font-family: var(--body); font-size: 12px; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--fg-muted); cursor: pointer; transition: all 0.15s; }
  .suggestion-chip:hover { border-color: var(--teal); color: var(--teal); }

  @media (max-width: 480px) {
    .countdown-num { font-size: 28px; }
    .info-cards { grid-template-columns: 1fr; }
    .chat-panel { width: calc(100vw - 32px); left: 16px; }
    html[data-lang="en"] .chat-panel { left: auto; right: 16px; }
  }
</style>

<button class="lang-toggle" id="lang-toggle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  <span id="lang-label">English</span>
</button>

<div class="header">
  <div class="header-label" data-i="headerLabel"></div>
  <h1 data-i="headerTitle"></h1>
  <p data-i="headerDesc"></p>
</div>

<div class="countdown">
  <div class="countdown-unit"><div class="countdown-num" id="cd-days"></div><div class="countdown-label" data-i="days"></div></div>
  <div class="countdown-unit"><div class="countdown-num" id="cd-hours"></div><div class="countdown-label" data-i="hours"></div></div>
  <div class="countdown-unit"><div class="countdown-num" id="cd-mins"></div><div class="countdown-label" data-i="minutes"></div></div>
</div>

<div class="surgery-info">
  <div class="surgery-info-item"><span class="surgery-info-label" data-i="procedure"></span><span class="surgery-info-value" data-i="procedureVal"></span></div>
  <div class="surgery-info-item"><span class="surgery-info-label" data-i="date"></span><span class="surgery-info-value" data-i="dateVal"></span></div>
  <div class="surgery-info-item"><span class="surgery-info-label" data-i="arrival"></span><span class="surgery-info-value" data-i="arrivalVal"></span></div>
  <div class="surgery-info-item"><span class="surgery-info-label" data-i="surgeon"></span><span class="surgery-info-value" data-i="surgeonVal"></span></div>
</div>

<div class="progress-wrap">
  <div class="progress-header">
    <span class="progress-label" data-i="progress"></span>
    <span class="progress-pct" id="progress-pct"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<nav class="phase-nav" id="phase-nav"></nav>

<div class="phase-section" id="phase-2weeks">
  <div class="section">
    <div class="section-title"><span class="section-icon" style="background:var(--teal-soft);color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span><span data-i="sec2weeks"></span></div>
    <div class="checklist" id="list-2weeks"></div>
  </div>
</div>
<div class="phase-section" id="phase-1week">
  <div class="section">
    <div class="section-title"><span class="section-icon" style="background:var(--amber-soft);color:var(--amber);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span data-i="sec1week"></span></div>
    <div class="checklist" id="list-1week"></div>
  </div>
</div>
<div class="phase-section" id="phase-daybefore">
  <div class="alert alert-coral"><span class="alert-icon">&#9888;&#65039;</span><div class="alert-content"><strong data-i="fastingTitle"></strong><p data-i="fastingDesc"></p></div></div>
  <div class="section">
    <div class="section-title"><span class="section-icon" style="background:var(--coral-soft);color:var(--coral);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span><span data-i="secDayBefore"></span></div>
    <div class="checklist" id="list-daybefore"></div>
  </div>
</div>
<div class="phase-section" id="phase-dayof">
  <div class="section">
    <div class="section-title"><span class="section-icon" style="background:var(--green-soft);color:var(--green);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><span data-i="secDayOf"></span></div>
    <div class="checklist" id="list-dayof"></div>
  </div>
</div>
<div class="phase-section" id="phase-reference">
  <div class="section"><div class="section-title"><span class="section-icon" style="background:var(--teal-soft);color:var(--teal);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span><span data-i="secBring"></span></div></div>
  <div class="info-cards" id="info-cards"></div>
  <div class="alert alert-amber"><span class="alert-icon">&#128138;</span><div class="alert-content"><strong data-i="medAlertTitle"></strong><p data-i="medAlertDesc"></p></div></div>
  <div class="section"><div class="section-title"><span class="section-icon" style="background:var(--green-soft);color:var(--green);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span><span data-i="secContacts"></span></div></div>
  <div class="contact-card" id="contact-card"></div>
</div>

<div class="footer" data-i="footer"></div>

<button class="chat-fab" id="chat-fab" aria-label="Chat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>

<div class="chat-panel" id="chat-panel">
  <div class="chat-header">

        fasting: { q: 'What are the fasting instructions?', a: 'Fasting is crucial for your safety during anesthesia:\n\n• Stop eating after midnight the night before surgery\n• Clear liquids (water, apple juice, black coffee without milk) are allowed up to 2 hours before arrival\n• No gum or candy on the morning of surgery\n• If you have diabetes, ask your doctor about managing blood sugar while fasting\n\nFasting prevents serious complications during anesthesia. Follow your medical team\'s instructions carefully.', follow: ['meds','anesthesia','bring'] },

        bring: { q: 'What should I bring on surgery day?', a: 'Bring these essentials:\n\nDocuments:\n• Photo ID\n• Health insurance card\n• Signed consent forms\n• Current medication list\n\nClothing:\n• Loose, comfortable clothes for going home\n• Slip-on shoes with no laces\n\nLeave at home:\n• Jewelry and valuables\n• Contact lenses (bring glasses instead)', follow: ['fasting','anesthesia','recovery'] },
        recovery: { q: 'How long is the recovery?', a: 'Recovery from laparoscopic cholecystectomy is usually short:\n\n• Most patients go home the same day\n• Light walking: same day as surgery\n• Light activities: within 3-5 days\n• Office work: about 1 week\n• Physical work: 2-4 weeks\n• Full recovery: 4-6 weeks\n\nAvoid lifting heavy objects (over 10 lbs) for 2-4 weeks.', follow: ['pain','food','shower_post'] },
        anesthesia: { q: 'What should I expect from anesthesia?', a: 'General anesthesia is most common for this procedure:\n\n• The anesthesiologist will meet you before surgery\n• You\'ll be fully asleep and feel nothing\n• After waking: drowsiness and nausea are normal\n• Mild sore throat is normal from the breathing tube\n\nImportant:\n• Tell the anesthesiologist about any allergies\n• You cannot drive for 24 hours after anesthesia', follow: ['fasting','pain','recovery'] },
        pain: { q: 'How will the pain be after surgery?', a: 'Pain after laparoscopic cholecystectomy is usually mild to moderate:\n\n• Pain at the small incision sites (3-4 small openings)\n• Right shoulder pain — this is normal from CO2 gas and resolves in 1-2 days\n• Mild abdominal bloating\n\nPain management:\n• Take painkillers regularly for the first 2-3 days\n• Cold compresses on incision sites help\n• Light walking reduces bloating and shoulder pain\n\nSee your doctor if pain suddenly increases or fever exceeds 100.4°F.', follow: ['recovery','food','meds'] },
        food: { q: 'What can I eat after surgery?', a: 'Follow this gradual diet plan:\n\nFirst 24 hours:\n• Clear liquids only (water, broth, light tea)\n\nFirst week:\n• Small, frequent meals (5-6 small meals)\n• White rice, toast, bananas\n• Grilled chicken or fish without oil\n• Avoid fats and fried foods completely\n\nFirst month:\n• Add foods gradually\n• Reduce fats (no more than 3g fat per meal)\n• Avoid spicy foods\n\nAfter 4-6 weeks: most people return to their normal diet gradually.', follow: ['recovery','pain','shower_post'] },
        shower_post: { q: 'When can I shower after surgery?', a: 'Showering instructions after surgery:\n\n• You can usually shower after 24-48 hours\n• Use warm, not hot water\n• Gently wash incision sites with water and soap\n• Pat dry (don\'t rub)\n• No soaking in bathtubs or pools for 2 weeks\n\nSee your doctor if:\n• Increasing redness or swelling around the incision\n• Discharge or pus from the wound\n• Fever above 100.4°F (38°C)', follow: ['recovery','pain','food'] },
      },
      faqKeywords: {
        fasting: ['fast','fasting','eat before','food before','drink before','midnight','hungry','NPO'],
        meds: ['medicine','medication','drug','pill','blood thinner','aspirin','supplement','vitamin','stop taking'],
        bring: ['bring','pack','bag','clothes','ID','what to take'],
        recovery: ['recovery','heal','return','go back','work','exercise','how long','when can I'],
        anesthesia: ['anesthesia','sedation','sleep','asleep','wake up','general'],
        pain: ['pain','hurt','painkiller','sore','ache','painful'],
        food: ['eat after','food after','diet','fat','fried','meal after'],
        shower_post: ['shower after','bath after','wash','wound','incision','water on'],
      },
      defaultAnswer: 'Thank you for your question! This requires consulting your medical team directly. You can call the surgeon\'s office at (555) 234-5678.\n\nYou can also ask me about these topics:',
    }
  };

  const checkSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const iconSvgs = {
    folder: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
    bag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    no: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
  };
  const listMap = { '2weeks': ['ins','preop','meds','ride','caregiver','work'], '1week': ['groceries','home','rxfill','stopsupp','pets'], daybefore: ['shower','nails','bag','confirm','fasting'], dayof: ['amshower','okmed','clothes','docs','arrive'] };
  const phaseIds = ['2weeks','1week','daybefore','dayof','reference'];

  let lang = 'ar';
  try { const s = localStorage.getItem('surgery-lang'); if (s === 'en' || s === 'ar') lang = s; } catch(e) {}
  let checkedItems = {};
  try { const s = localStorage.getItem('surgery-prep-checked'); if (s) checkedItems = JSON.parse(s); } catch(e) {}
  let activePhase = '2weeks';
  try { const s = localStorage.getItem('surgery-prep-phase'); if (s && phaseIds.includes(s)) activePhase = s; } catch(e) {}

  function t(key) { return T[lang][key] || key; }

  function applyLang() {
    const html = document.documentElement;
    html.setAttribute('data-lang', lang);
    html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    html.setAttribute('lang', lang);
    document.title = lang === 'ar' ? 'التحضير للعملية' : 'Surgery Prep';
    document.getElementById('lang-label').textContent = lang === 'ar' ? 'English' : 'العربية';

    document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
    document.querySelectorAll('[data-i-placeholder]').forEach(el => { el.placeholder = t(el.dataset.iPlaceholder); });

    buildChecklists();
    buildInfoCards();
    buildContacts();
    renderNav();
    showPhase();
    updateProgress();
    updateCountdown();
    resetChat();
    try { localStorage.setItem('surgery-lang', lang); } catch(e) {}
  }

  function buildChecklists() {
    const items = T[lang].items;
    for (const [phase, ids] of Object.entries(listMap)) {
      const list = document.getElementById('list-' + phase);
      list.innerHTML = '';
      ids.forEach(id => {
        const [text, desc, tag] = items[id];
        const div = document.createElement('div');
        div.className = 'check-item' + (checkedItems[id] ? ' done' : '');
        div.dataset.id = id;
        let tagHtml = '';
        if (tag === 'important') tagHtml = '<span class="check-tag tag-important">' + t('important') + '</span>';
        if (tag === 'reminder') tagHtml = '<span class="check-tag tag-reminder">' + t('doEarly') + '</span>';
        div.innerHTML = '<div class="checkbox">' + checkSvg + '</div><div class="check-content"><div class="check-text">' + text + '</div><div class="check-desc">' + desc + '</div>' + tagHtml + '</div>';
        div.addEventListener('click', () => {
          div.classList.toggle('done');
          checkedItems[id] = div.classList.contains('done');
          try { localStorage.setItem('surgery-prep-checked', JSON.stringify(checkedItems)); } catch(e) {}
          updateProgress(); renderNav();
        });
        list.appendChild(div);
      });
    }
  }

  function buildInfoCards() {
    const wrap = document.getElementById('info-cards');
    wrap.innerHTML = '';
    T[lang].infoCards.forEach(c => {
      const card = document.createElement('div');
      card.className = 'info-card';
      card.innerHTML = '<h3>' + iconSvgs[c.icon] + ' ' + c.title + '</h3><ul>' + c.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
      wrap.appendChild(card);
    });
  }

  function buildContacts() {
    const wrap = document.getElementById('contact-card');
    wrap.innerHTML = '';
    T[lang].contacts.forEach(([label, val]) => {
      const div = document.createElement('div');
      div.className = 'contact-entry';
      div.innerHTML = '<span class="contact-label">' + label + '</span><span class="contact-value">' + val + '</span>';
      wrap.appendChild(div);
    });
  }

  const nav = document.getElementById('phase-nav');
  function getPhaseCount(id) {
    const sec = document.getElementById('phase-' + id);
    if (!sec) return null;
    const items = sec.querySelectorAll('.check-item');
    if (!items.length) return null;
    const done = Array.from(items).filter(i => i.classList.contains('done')).length;
    return done + '/' + items.length;
  }

  function renderNav() {
    nav.innerHTML = '';
    phaseIds.forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'phase-btn' + (id === activePhase ? ' active' : '');
      btn.textContent = T[lang].phases[id];
      const c = getPhaseCount(id);
      if (c) { const sp = document.createElement('span'); sp.className = 'count'; sp.textContent = c; btn.appendChild(sp); }
      btn.addEventListener('click', () => { activePhase = id; try { localStorage.setItem('surgery-prep-phase', activePhase); } catch(e) {} showPhase(); renderNav(); });
      nav.appendChild(btn);
    });
  }

  function showPhase() {
    document.querySelectorAll('.phase-section').forEach(el => el.classList.toggle('visible', el.id === 'phase-' + activePhase));
  }

  function updateProgress() {
    const all = document.querySelectorAll('.check-item');
    const done = document.querySelectorAll('.check-item.done');
    const pct = all.length ? Math.round((done.length / all.length) * 100) : 0;
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  const surgeryDate = new Date(2026, 10, 2, 6, 0, 0);
  function updateCountdown() {
    let diff = Math.max(0, surgeryDate - new Date());
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    document.getElementById('cd-days').textContent = String(d).padStart(2, '0');
    document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
    document.getElementById('cd-mins').textContent = String(m).padStart(2, '0');
  }
  setInterval(updateCountdown, 60000);

  // Lang toggle
  document.getElementById('lang-toggle').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); });

  // Chat
  const fab = document.getElementById('chat-fab');
  const panel = document.getElementById('chat-panel');
  const closeBtn = document.getElementById('chat-close');
  const msgs = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  let chatOpen = false, sending = false;

  fab.addEventListener('click', () => { chatOpen = !chatOpen; panel.classList.toggle('open', chatOpen); if (chatOpen) input.focus(); });
  closeBtn.addEventListener('click', () => { chatOpen = false; panel.classList.remove('open'); });

  function buildSuggestions(keys) {
    const wrap = document.createElement('div');
    wrap.className = 'suggestions';
    keys.forEach(k => {
      if (!T[lang].faq[k]) return;
      const btn = document.createElement('button');
      btn.className = 'suggestion-chip';
      btn.dataset.q = k;
      btn.textContent = T[lang].faqLabels[k];
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function addUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'chat-msg user';
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTypingThenAnswer(answer, followKeys) {
    const typing = document.createElement('div');
    typing.className = 'chat-msg ai typing';
    typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => {
      typing.classList.remove('typing');
      typing.textContent = answer;
      if (followKeys && followKeys.length) msgs.appendChild(buildSuggestions(followKeys));
      msgs.scrollTop = msgs.scrollHeight;
      sending = false;
      sendBtn.disabled = false;
    }, 600 + Math.random() * 800);
  }

  function findAnswer(text) {
    const t2 = text.trim().toLowerCase();
    let bestKey = null, bestScore = 0;
    for (const [key, words] of Object.entries(T[lang].faqKeywords)) {
      let score = 0;
      for (const w of words) { if (t2.includes(w.toLowerCase())) score++; }
      if (score > bestScore) { bestScore = score; bestKey = key; }
    }
    if (bestKey && T[lang].faq[bestKey]) return { answer: T[lang].faq[bestKey].a, follow: T[lang].faq[bestKey].follow };
    return { answer: T[lang].defaultAnswer, follow: ['fasting','meds','bring','recovery','anesthesia','pain'] };
  }

  function handleQuestion(key) {
    if (sending) return;
    sending = true; sendBtn.disabled = true;
    const entry = T[lang].faq[key];
    if (entry) { addUserMsg(entry.q); showTypingThenAnswer(entry.a, entry.follow); }
  }

  function handleFreeText(text) {
    if (!text.trim() || sending) return;
    sending = true; sendBtn.disabled = true;
    addUserMsg(text.trim());
    input.value = ''; input.style.height = 'auto';
    const { answer, follow } = findAnswer(text);
    showTypingThenAnswer(answer, follow);
  }

  function resetChat() {
    msgs.innerHTML = '';
    const welcome = document.createElement('div');
    welcome.className = 'chat-msg ai';
    welcome.textContent = t('chatWelcome');
    msgs.appendChild(welcome);
    msgs.appendChild(buildSuggestions(['fasting','meds','bring','recovery','anesthesia','pain','food','shower_post']));
  }

  msgs.addEventListener('click', e => { const chip = e.target.closest('.suggestion-chip'); if (chip) handleQuestion(chip.dataset.q); });
  sendBtn.addEventListener('click', () => handleFreeText(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleFreeText(input.value); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 100) + 'px'; });

  applyLang();
})();
</script>
